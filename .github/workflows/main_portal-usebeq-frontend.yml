name: Build and deploy Vite React app to Azure Web App - portal-usebeq-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist  # ← Aquí va la carpeta de salida de Vite

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1AC0FE1F6C5A43A29EFBBCD0B779CF38 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B4BC02F510244AA6B4E04AB6F67769B5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3D31460EF7E24398938CB0B16BA3BACE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'portal-usebeq-frontend'
          slot-name: 'Production'
          package: .  # ← El artefacto descargado ya es la carpeta 'dist'